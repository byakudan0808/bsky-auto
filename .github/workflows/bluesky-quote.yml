name: bluesky-quote

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bluesky-quote
  cancel-in-progress: false

jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run
        env:
          BSKY_A_HANDLE: ${{ secrets.BSKY_A_HANDLE }}
          BSKY_B_HANDLE: ${{ secrets.BSKY_B_HANDLE }}

          BSKY_B_PASSWORD: ${{ secrets.BSKY_B_PASSWORD }}
        run: python bluesky_quote.py

      - name: Commit state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "update state"
            git push
          fi
